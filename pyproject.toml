[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "radar-obrigacoes-contratuais"
version = "0.1.0"
description = "Radar local de obrigações contratuais com dados sintéticos"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.50,<2",
]

[project.scripts]
radar = "radar_contratos.cli:main"

[dependency-groups]
dev = ["pytest>=8,<11", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/radar_contratos"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/docs", "/.github", "/.streamlit/config.toml",
    "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.python-version",
    "/.env.example", "/.gitignore", "/.gitattributes",
]
exclude = ["/.tools", "/.venv", "/.uv-cache", "/var", "/dist"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.uv]
required-version = "==0.13.6"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
